amcl:
  ros__parameters:
    alpha1: 0.1
    alpha2: 0.1
    alpha3: 0.1
    alpha4: 0.1
    alpha5: 0.1
    base_frame_id: base_link
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: true
    global_frame_id: map
    lambda_short: 0.1
    laser_likelihood_max_dist: 1.0
    laser_max_range: 8.0
    laser_min_range: 0.3
    laser_model_type: likelihood_field
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: odom
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.05
    recovery_alpha_slow: 0.05
    resample_interval: 1
    robot_model_type: nav2_amcl::OmniMotionModel
    save_pose_rate: 0.5
    sigma_hit: 0.1
    tf_broadcast: true
    transform_tolerance: 0.5
    update_min_a: 0.02
    update_min_d: 0.01
    z_hit: 0.8
    z_max: 0.05
    z_rand: 0.2
    z_short: 0.05
    scan_topic: merged
    set_initial_pose: true
bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /topic_gv_wheel_odom_0_306
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    default_nav_to_pose_bt_xml: /opt/seva/session/config/native-frontier-navigation.xml
controller_server:
  ros__parameters:
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: progress_checker
    goal_checker_plugins:
    - general_goal_checker
    controller_plugins:
    - FollowPath
    progress_checker:
      plugin: nav2_controller::PoseProgressChecker
      required_movement_radius: 0.1
      required_movement_angle: 0.2
      movement_time_allowance: 45.0
    general_goal_checker:
      stateful: true
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.1
      yaw_goal_tolerance: 3.14
    FollowPathDwb:
      plugin: dwb_core::DWBLocalPlanner
      debug_trajectory_details: true
      min_vel_x: -0.15
      min_vel_y: 0.0
      max_vel_x: 0.5
      max_vel_y: 0.0
      max_vel_theta: 3.0
      min_speed_xy: -0.16
      max_speed_xy: 0.16
      min_speed_theta: 1.0
      acc_lim_x: 1.0
      acc_lim_y: 0.0
      acc_lim_theta: 4.0
      decel_lim_x: -1.0
      decel_lim_y: 0.0
      decel_lim_theta: -4.0
      vx_samples: 30
      vy_samples: 5
      vtheta_samples: 40
      sim_time: 1.7
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.1
      xy_goal_tolerance: 0.1
      trans_stopped_velocity: 0.25
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics:
      - RotateToGoal
      - Oscillation
      - BaseObstacle
      - GoalAlign
      - PathAlign
      - PathDist
      - GoalDist
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.1
      lookahead_dist: 0.8
      min_lookahead_dist: 0.1
      max_lookahead_dist: 1.0
      lookahead_time: 1.0
      rotate_to_heading_angular_vel: 0.08
      transform_tolerance: 0.5
      use_velocity_scaled_lookahead_dist: false
      min_approach_linear_velocity: 0.025
      approach_velocity_scaling_dist: 0.6
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_fixed_curvature_lookahead: false
      curvature_lookahead_dist: 0.25
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.5
      cost_scaling_gain: 1.0
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.04
      use_rotate_to_heading: true
      allow_reversing: false
      rotate_to_heading_min_angle: 1.0
      max_angular_accel: 1.6
      max_robot_pose_search_dist: 10.0
      min_distance_to_obstacle: 0.1
      stateful: true
      inflation_cost_scaling_factor: 5.0
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 10.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.02
      footprint: '[[-0.07072, -0.31739], [-0.26815, -0.21452], [-0.28234, -0.20038],
        [-0.29481, -0.17539], [-0.30459, -0.04723], [-0.30401, 0.05898], [-0.29754,
        0.16573], [-0.29068, 0.18947], [-0.27793, 0.20722], [-0.06354, 0.32218], [-0.04715,
        0.32685], [0.01426, 0.3281], [0.07285, 0.32489], [0.22844, 0.28828], [0.41596,
        0.22964], [0.44187, 0.21351], [0.4753, 0.17742], [0.51143, 0.10727], [0.54014,
        -0.18587], [0.53442, -0.20934], [0.51925, -0.23097], [0.46902, -0.27653],
        [0.40634, -0.30951], [0.17257, -0.32568], [-0.04198, -0.3259]]'
      plugins:
      - voxel_layer
      - inflation_layer
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 5.0
        inflation_radius: 0.7
      voxel_layer:
        plugin: nav2_costmap_2d::VoxelLayer
        enabled: true
        publish_voxel_map: false
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: front_scan rear_scan
        front_scan:
          topic: /zeng306/front_filtered
          data_type: LaserScan
          marking: true
          clearing: true
          obstacle_min_range: 0.0
          obstacle_max_range: 4.5
          raytrace_min_range: 0.0
          raytrace_max_range: 5.0
          max_obstacle_height: 2.0
        rear_scan:
          topic: /zeng306/rear_filtered
          data_type: LaserScan
          marking: true
          clearing: true
          obstacle_min_range: 0.0
          obstacle_max_range: 4.5
          raytrace_min_range: 0.0
          raytrace_max_range: 5.0
          max_obstacle_height: 2.0
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      always_send_full_costmap: true
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 2.0
      publish_frequency: 2.0
      global_frame: map
      robot_base_frame: base_link
      footprint: '[[-0.07072, -0.31739], [-0.26815, -0.21452], [-0.28234, -0.20038],
        [-0.29481, -0.17539], [-0.30459, -0.04723], [-0.30401, 0.05898], [-0.29754,
        0.16573], [-0.29068, 0.18947], [-0.27793, 0.20722], [-0.06354, 0.32218], [-0.04715,
        0.32685], [0.01426, 0.3281], [0.07285, 0.32489], [0.22844, 0.28828], [0.41596,
        0.22964], [0.44187, 0.21351], [0.4753, 0.17742], [0.51143, 0.10727], [0.54014,
        -0.18587], [0.53442, -0.20934], [0.51925, -0.23097], [0.46902, -0.27653],
        [0.40634, -0.30951], [0.17257, -0.32568], [-0.04198, -0.3259]]'
      resolution: 0.02
      track_unknown_space: true
      plugins:
      - static_layer
      - inflation_layer
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 5.0
        inflation_radius: 0.7
      always_send_full_costmap: true
map_server:
  ros__parameters:
    yaml_filename: ''
map_saver:
  ros__parameters:
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true
planner_server:
  ros__parameters:
    expected_planner_frequency: 2.0
    planner_plugins:
    - GridBased
    GridBased:
      plugin: nav2_smac_planner::SmacPlanner2D
      tolerance: 0.3
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      cost_travel_multiplier: 2.0
      use_final_approach_orientation: true
smoother_server:
  ros__parameters:
    smoother_plugins:
    - simple_smoother
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true
behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins:
    - spin
    - backup
    - drive_on_heading
    - assisted_teleop
    - wait
    spin:
      plugin: nav2_behaviors::Spin
    backup:
      plugin: nav2_behaviors::BackUp
    drive_on_heading:
      plugin: nav2_behaviors::DriveOnHeading
    wait:
      plugin: nav2_behaviors::Wait
    assisted_teleop:
      plugin: nav2_behaviors::AssistedTeleop
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.08
    min_rotational_vel: 0.03
    rotational_acc_lim: 0.08
waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 200
velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity:
    - 0.1
    - 0.0
    - 0.09
    min_velocity:
    - -0.06
    - 0.0
    - -0.09
    max_accel:
    - 0.15
    - 0.15
    - 0.08
    max_decel:
    - -0.3
    - -0.3
    - -0.16
    odom_topic: /topic_gv_wheel_odom_0_306
    odom_duration: 0.1
    deadband_velocity:
    - 0.0
    - 0.0
    - 0.0
    velocity_timeout: 0.5
docking_server:
  ros__parameters:
    controller_frequency: 50.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    max_retries: 3
    base_frame: base_link
    fixed_frame: odom
    odom_topic: odom
    dock_backwards: true
    dock_prestaging_tolerance: 0.5
    introspection_mode: disabled
    dock_plugins:
    - autolife_dock
    autolife_dock:
      plugin: opennav_docking::SimpleChargingDock
      docking_threshold: 0.15
      staging_x_offset: -0.5
      staging_yaw_offset: 3.14
      use_external_detection_pose: true
      use_battery_status: false
      use_stall_detection: false
      rotate_to_dock: false
      external_detection_timeout: 2.0
      external_detection_translation_x: -0.1
      external_detection_translation_y: 0.0
      external_detection_rotation_roll: 0.0
      external_detection_rotation_pitch: 0.0
      external_detection_rotation_yaw: 0.0
      filter_coef: 0.1
      dock_direction: backward
    docks:
    - home_dock
    home_dock:
      type: autolife_dock
      frame: map
      pose:
      - 0.506
      - 1.53
      - 1.45
      id: c67f50cb-e152-4720-85cc-5eb20bd85ce8
    controller:
      k_phi: 1.0
      k_delta: 1.0
      v_linear_min: 0.05
      v_linear_max: 0.05
      v_angular_max: 0.35
      slowdown_radius: 0.25
      rotate_to_heading_angular_vel: 0.2
      rotate_to_heading_max_angular_accel: 3.2
      use_collision_detection: false
      costmap_topic: local_costmap/costmap_raw
      footprint_topic: local_costmap/published_footprint
      transform_tolerance: 0.1
      projection_time: 1.0
      simulation_time_step: 0.1
      dock_collision_threshold: 0.3
