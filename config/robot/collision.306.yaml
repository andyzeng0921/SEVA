collision_monitor:
  ros__parameters:
    base_frame_id: base_link
    odom_frame_id: odom
    cmd_vel_in_topic: /zeng306/cmd_vel_smoothed
    cmd_vel_out_topic: /topic_gv_target_cmd_vel_0_306
    state_topic: /zeng306/collision_state
    transform_tolerance: 0.2
    source_timeout: 0.5
    base_shift_correction: true
    stop_pub_timeout: 2.0
    polygons:
    - PolygonStop
    - PolygonSlow
    - FootprintApproach
    PolygonStop:
      type: polygon
      points: '[[-0.08223, -0.33958], [-0.28228, -0.23515], [-0.30292, -0.21457],
        [-0.31798, -0.18478], [-0.32372, -0.15899], [-0.32956, -0.04836], [-0.32899,
        0.05992], [-0.32196, 0.17106], [-0.31348, 0.19973], [-0.30224, 0.21779], [-0.27469,
        0.23986], [-0.08112, 0.34162], [-0.04109, 0.35231], [0.05474, 0.35228], [0.11757,
        0.34095], [0.23887, 0.3113], [0.42343, 0.2535], [0.45402, 0.23638], [0.50111,
        0.18348], [0.53064, 0.12919], [0.53746, 0.10306], [0.56512, -0.18677], [0.55707,
        -0.21994], [0.5367, -0.24887], [0.48367, -0.29678], [0.43446, -0.3257], [0.41174,
        -0.33392], [0.17282, -0.35068], [-0.04263, -0.35089]]'
      action_type: stop
      min_points: 1
      visualize: true
      polygon_pub_topic: polygon_stop
      enabled: true
    PolygonSlow:
      type: polygon
      points: '[[0.95,0.52],[0.95,-0.52],[-0.65,-0.52],[-0.65,0.52]]'
      action_type: limit
      min_points: 1
      visualize: true
      polygon_pub_topic: polygon_slowdown
      enabled: true
      linear_limit: 0.04
      angular_limit: 0.08
    observation_sources:
    - front_scan
    - rear_scan
    enable_stamped_cmd_vel: false
    front_scan:
      type: scan
      topic: /zeng306/front_filtered
      enabled: true
    rear_scan:
      type: scan
      topic: /zeng306/rear_filtered
      enabled: true
    FootprintApproach:
      type: polygon
      action_type: approach
      footprint_topic: /local_costmap/published_footprint
      time_before_collision: 2.0
      simulation_time_step: 0.05
      min_points: 1
      visualize: false
      enabled: true
