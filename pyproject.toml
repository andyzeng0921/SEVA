[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seva-robot"
version = "0.1.0"
description = "SEVA: Semantic Exploration with Verified Actions"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
  "fastapi>=0.111", "uvicorn>=0.30", "pydantic>=2.7", "PyYAML>=6.0",
  "requests>=2.31", "numpy>=1.24", "Pillow>=10", "opencv-python-headless>=4.8",
  "filelock>=3.13", "jsonschema>=4.20", "termcolor>=2.3", "sympy>=1.12",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[project.urls]
Repository = "https://github.com/andyzeng0921/SEVA"

[tool.setuptools.packages.find]
where = ["src", "integrations"]
include = ["zeng_agent*", "upstream306*", "exploration306*"]
namespaces = false

[tool.pytest.ini_options]
pythonpath = ["src", "integrations"]
testpaths = ["tests", "integrations/exploration306/test_reward_policy.py"]
