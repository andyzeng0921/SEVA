# Copy to config.yaml; provide credentials through SEVA_* environment variables.
dry_run: true
host: 127.0.0.1
port: 8765
log_level: info
topic_node_id: "0_306"
waypoint_names:
  - home
  - dock
allowed_arm_presets:
  - reset
  - stop
  - zero_position
  - wave
  - package_pos
  - standup_pos
  - left_open_gripper
  - left_close_gripper
  - right_open_gripper
  - right_close_gripper
arm_preset_commands: {}
local_asr:
  device: default
  sample_rate: 16000
  channels: 1
  duration_seconds: 4
  transcriber_command: null
remote_asr:
  enabled: false
  base_url: ""
  timeout_seconds: 20
relay:
  ws_url: ws://127.0.0.1:3000/ws
  tcp_host: 127.0.0.1
  tcp_port: 3000
ros2:
  ros_setup: /opt/ros/jazzy/setup.bash
  workspace_setup: ./ros2_ws/install/setup.bash
  navigate_service: /navigate_to_waypoint
  save_waypoint_service: /save_waypoint
  list_waypoints_service: /list_waypoints
  delete_waypoint_service: /delete_waypoint
  stop_topic: /topic_gv_target_cmd_vel_0_306

brain:
  enabled: true
  framework: langgraph_ready
  state_backend: memory
  robot_profile: zhidongweilai_s2
  require_confirmation_for_motion: true
  max_steps: 8

llm:
  enabled: false
  base_url: http://127.0.0.1:8000/v1
  model: qwen3-32b
  api_key: ""
  timeout_seconds: 30
fire_search:
  enabled: false
  vision_api_url: http://127.0.0.1:8000/v1/chat/completions
  vision_model: qwen3.5-35b-a3b
  vision_api_key: ""
  vision_timeout_seconds: 30
openclaw_robot:
  enabled: false
